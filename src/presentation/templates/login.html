{% extends "base.html" %}
{% block content %}
<div class="form-card">
    <h2>Giriş Yap</h2>
    <form method="POST">
        <div class="form-group">
            <label>E-posta</label>
            <input type="email" name="email" required>
        </div>
        <div class="form-group">
            <label>Şifre</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary">Giriş Yap</button>
    </form>
    <p>Hesabın yok mu? <a href="{{ url_for('main.register') }}">Kayıt ol</a></p>
</div>
{% endblock %}
